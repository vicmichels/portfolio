<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Vic Michels</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Vic Michels</div>
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="projects.html">Projets</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="contact-container fade-in">
    <h1>Contact</h1>
    <p class="contact-intro">
      Tu veux discuter d’un projet, d’une collaboration ou d’un stage ? Envoie-moi un message ou écris-moi directement à <a href="mailto:michelsvic@gmail.com">michelsvic@gmail.com</a>.
    </p>

    <form class="contact-form" action="https://formspree.io/f/yourformid" method="POST">
      <label for="name">Nom</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="_replyto" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit" class="cta">Envoyer</button>
    </form>
  </main>

  <footer>
    <p>© Vic Michels – Tous droits réservés</p>
  </footer>

  <script src="assets/js/scroll.js"></script>
</body>
</html>
